<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายใจ - ขายความรู้สึกแทนสินค้า</title>
    <style>
        :root {
            --main-color: #ff8fa3;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }
        body {
            font-family: 'Kanit', sans-serif, Tahoma;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: var(--main-color);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        nav h1 { margin: 0; font-size: 1.3rem; }
        .nav-btn {
            background: white;
            color: var(--main-color);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section { display: none; }
        .active { display: block; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .product-img {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            background-color: #ffe5ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }
        .btn-buy {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid var(--main-color);
        }
        .order-list {
            background: white;
            border-radius: 10px;
            padding: 15px;
        }
        .order-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <nav>
        <h1>💖 ร้านขายใจ</h1>
        <div>
            <button class="nav-btn" onclick="showPage('shop')">🛒 หน้าร้าน</button>
            <button class="nav-btn" onclick="showPage('admin')">⚙️ หลังบ้าน</button>
        </div>
    </nav>

    <div class="container">
        <!-- หน้าร้าน -->
        <div id="shop" class="section active">
            <h2>เลือกอารมณ์/ความรู้สึกที่ต้องการ ✨</h2>
            <div class="product-grid" id="product-container"></div>
        </div>

        <!-- หลังบ้าน -->
        <div id="admin" class="section">
            <h2>📊 Dashboard หลังบ้าน (ระบบขาย)</h2>
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>คำสั่งซื้อทั้งหมด</h3>
                    <p id="total-orders" style="font-size: 1.5rem; font-weight: bold;">0</p>
                </div>
                <div class="stat-card">
                    <h3>สมาชิก (Member)</h3>
                    <p style="font-size: 1.5rem; font-weight: bold;">12 คน</p>
                </div>
            </div>

            <div class="order-list">
                <h3>รายการสั่งซื้อล่าสุด</h3>
                <div id="order-history">
                    <p style="color: #888;">ยังไม่มีรายการสั่งซื้อเข้ามา</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'ชุดคลายเครียด', desc: 'สกุชชี่ + ลูกบอลบีบ + ข้อความให้กำลังใจ', price: 150, emoji: '🧘' },
            { id: 2, name: 'ชุดคนเหงา', desc: 'ตุ๊กตาน่ารัก + พวงกุญแจ + สติ๊กเกอร์ + ขนมหวาน', price: 199, emoji: '🧸' },
            { id: 3, name: 'ชุดเพิ่มความมั่นใจ', desc: 'การ์ดชมตัวเอง + กระจกเล็กลายน่ารักพกพาได้', price: 120, emoji: '🪞' },
            { id: 4, name: 'ชุดเพิ่มความสุข', desc: 'ขนมเล็กๆ น่ารัก + ข้อความดีๆ อ่านแล้วยิ้ม', price: 99, emoji: '🍬' },
            { id: 5, name: 'ชุดพักใจ', desc: 'เทียนหอมกลิ่นผ่อนคลาย + เพลย์ลิสต์เพลงสบายๆ', price: 250, emoji: '🕯️' }
        ];

        let orderCount = 0;

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img">${p.emoji}</div>
                    <h3>${p.name}</h3>
                    <p style="font-size: 0.85rem; color: #666;">${p.desc}</p>
                    <p style="font-weight: bold; color: #ff8fa3;">${p.price} บาท</p>
                    <button class="btn-buy" onclick="buyProduct('${p.name}')">สั่งซื้อชุดนี้</button>
                </div>
            `).join('');
        }

        function buyProduct(name) {
            orderCount++;
            document.getElementById('total-orders').innerText = orderCount;
            const orderHistory = document.getElementById('order-history');
            if(orderCount === 1) orderHistory.innerHTML = '';
            const time = new Date().toLocaleTimeString('th-TH');
            orderHistory.innerHTML += `
                <div class="order-item">
                    <span>📦 สั่งซื้อ: <b>${name}</b></span>
                    <span style="color: #888; font-size: 0.8rem;">${time}</span>
                </div>
            `;
            alert(`ขอบคุณที่สั่งซื้อ "${name}" ขอให้มีความสุขและยิ้มได้ในวันนี้นะครับ!`);
        }

        function showPage(pageId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        renderProducts();
    </script>
</body>
</html>
